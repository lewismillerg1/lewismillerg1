name: Metrics

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: lewismillerg1
          filename: metrics/main.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/Denver
          config_animations: yes
          extras_css: |
            svg { background: #0d1117; color: #c9d1d9; }
            h2 { color: #58a6ff; }
            .field svg, svg .octicon { fill: #8b949e; }

          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_analysis_timeout: 15

          plugin_lines: yes
          plugin_lines_sections: base, history
          plugin_lines_history_limit: 1

          plugin_repositories: yes
          plugin_repositories_featured: lewismillerg1/wedding

          plugin_code: yes
          plugin_code_lines: 12

          plugin_introduction: yes
          plugin_introduction_title: yes

          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_charts_type: classic

          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
          plugin_achievements_display: detailed
          plugin_achievements_limit: 0

  isocalendar:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: lewismillerg1
          filename: metrics/isocalendar.svg
          base: ""
          config_timezone: America/Denver
          extras_css: |
            svg { background: #0d1117; color: #c9d1d9; }
            h2 { color: #58a6ff; }
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

  repositories:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: lewismillerg1
          filename: metrics/repositories.svg
          base: ""
          config_timezone: America/Denver
          config_animations: yes
          extras_css: |
            svg { background: #0d1117; color: #c9d1d9; }
            h2 { color: #58a6ff; }
          plugin_repositories: yes
          plugin_repositories_forks: yes
          plugin_repositories_order: featured
          plugin_repositories_featured: >-
            lewismillerg1/wedding,
            lewismillerg1/leagueville,
            lewismillerg1/gym-app,
            lewismillerg1/couples-game,
            lewismillerg1/agent-teams-ai,
            lewismillerg1/discord-bot,
            lewismillerg1/FamilySearchRPG,
            lewismillerg1/svu-campus-clash
