name: Metrics

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: lewismillerg1
          filename: metrics/main.svg
          template: classic
          base: header, activity, repositories, metadata
          config_timezone: America/Denver
          config_animations: yes
          extras_css: |
            svg { background: #0d1117; color: #c9d1d9; }
            h2 { color: #58a6ff; }
            .field svg, svg .octicon { fill: #8b949e; }
            :root { --color-calendar-graph-day-bg:#161b22; --color-calendar-graph-day-border:rgba(240,246,252,0.08); }
            .calendar .day { outline-color: rgba(240,246,252,0.06); }

          plugin_introduction: yes
          plugin_introduction_title: yes

          # Standard language bars (indepth needs real commit diffs the account lacks)
          plugin_languages: yes
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage

          plugin_lines: yes
          plugin_lines_sections: base, history
          plugin_lines_history_limit: 1

          # Full-year commit calendar — now densely filled
          plugin_calendar: yes
          plugin_calendar_limit: 0

          plugin_repositories: yes
          plugin_repositories_featured: lewismillerg1/wedding

  isocalendar:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: lewismillerg1
          filename: metrics/isocalendar.svg
          base: ""
          config_timezone: America/Denver
          extras_css: |
            svg { background: #0d1117; color: #c9d1d9; }
            h2 { color: #58a6ff; }
            :root { --color-calendar-graph-day-bg:#161b22; --color-calendar-graph-day-border:rgba(240,246,252,0.08); }
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

  repositories:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: lewismillerg1
          filename: metrics/repositories.svg
          base: ""
          config_timezone: America/Denver
          config_animations: yes
          extras_css: |
            svg { background: #0d1117; color: #c9d1d9; }
            h2 { color: #58a6ff; }
          plugin_repositories: yes
          plugin_repositories_forks: yes
          plugin_repositories_order: featured
          plugin_repositories_featured: >-
            lewismillerg1/wedding,
            lewismillerg1/leagueville,
            lewismillerg1/gym-app,
            lewismillerg1/couples-game,
            lewismillerg1/agent-teams-ai,
            lewismillerg1/discord-bot,
            lewismillerg1/FamilySearchRPG,
            lewismillerg1/svu-campus-clash
